project:
  name: "CDT Backend CMS (Central Data Technology)"
  description: >
    A modular, plugin-based content management system built on Laravel.
    Supports custom post types (CPT), pages with block builder, blog posts,
    RBAC, multi-language translations, SEO, forms, and a headless REST API.
  url: "http://cdt.devs"
  admin_path: "ctrlpanel"
  default_locale: "en"
  available_locales: ["en", "id"]

tech_stack:
  language: "PHP 8.2+"
  framework: "Laravel 13.x"
  database: "MySQL (cdt_web)"
  frontend_admin: "Livewire 4.0 + Tailwind CSS 4 + TipTap 3"
  bundler: "Vite 7"
  queue: "database"
  cache: "database"
  testing: "Pest + PHPUnit 12"

key_features:
  - name: "Pages"
    description: "Block-based page builder with revisions, templates, parent-child hierarchy, per-locale translations"
    model: "Page"
    api_prefix: "/api/v1/pages"
    api_prefix_admin: "/api/v1/admin/pages"
    endpoints:
      public:
        - "GET /pages"
        - "GET /pages/{slug}"
      admin:
        - "GET/POST /pages"
        - "GET/PUT/DELETE /pages/{id}"
        - "GET/POST /pages/{id}/blocks"
        - "PUT/DELETE /pages/{id}/blocks/{blockId}"
        - "GET/PUT /pages/{id}/seo"
        - "GET /pages/{id}/revisions"
        - "POST /pages/{id}/revisions/{revisionId}/restore"
    content_types:
      - "Page blocks (text, textarea, wysiwyg, number, select, radio, checkbox, switcher, media, gallery, date, time, datetime, icon, color, posts, repeater)"
    statuses: ["draft", "published", "scheduled", "private"]

  - name: "Posts (Blog)"
    description: "Blog posts with categories, tags, authors, featured image, WYSIWYG editor, DOCX import"
    model: "Post (plugin: posts)"
    api_prefix: "/api/v1/posts"
    api_prefix_admin: "/api/v1/admin/posts"
    endpoints:
      public:
        - "GET /posts"
        - "GET /posts/{slug}"
        - "GET /posts/categories"
      admin:
        - "GET/POST /posts"
        - "PUT/DELETE /posts/{id}"
    statuses: ["draft", "published", "scheduled", "archived"]
    visibility: ["public", "password-protected"]
    taxonomies:
      - "Category (hierarchical)"
      - "Tag (flat)"

  - name: "Custom Post Types (CPT)"
    description: "WordPress-like custom post types with dynamic fields, meta boxes, taxonomies, relationships, and entries"
    model: "CustomPostType + CptEntry + MetaField"
    api_prefix: "/api/v1/cpt"
    api_prefix_admin: "/api/v1/admin/cpt"
    endpoints:
      public:
        - "GET /cpt/{type}"
        - "GET /cpt/{type}/{slug}"
      admin_cpt_schema:
        - "GET/POST /cpt"
        - "GET/PUT/DELETE /cpt/{id}"
        - "GET/POST /cpt/{id}/fields"
        - "PUT/DELETE /cpt/{id}/fields/{fieldId}"
      admin_cpt_entries:
        - "GET/POST /cpt/{type}/entries"
        - "GET/PUT/DELETE /cpt/{type}/entries/{id}"
        - "GET/PUT /cpt/{type}/entries/{id}/seo"
    field_types:
      - "text"
      - "textarea"
      - "wysiwyg"
      - "select"
      - "radio"
      - "checkbox"
      - "number"
      - "date"
      - "repeater"
      - "relationship"
      - "gallery"
      - "file"
      - "icon"
    entry_statuses: ["draft", "published", "scheduled", "archived"]
    cpt_examples:
      - "tech-products"

  - name: "Forms"
    description: "Form builder with conditional logic, multi-step, file uploads, spam protection, CSV export"
    model: "Form + FormField + FormEntry"
    api_prefix: "/api/v1/forms"
    api_prefix_admin: "/api/v1/admin/forms"
    endpoints:
      public:
        - "POST /forms/{slug}/submit"
      admin:
        - "GET/POST /forms"
        - "GET/PUT/DELETE /forms/{id}"
        - "GET /forms/{id}/entries"
        - "DELETE /forms/{id}/entries/{entryId}"

  - name: "Media"
    description: "Media library with image variants, WebP conversion, focal point, alt text"
    api_prefix: "/api/v1/media"
    endpoints:
      public:
        - "GET /media"
        - "GET /media/{id}"
      admin:
        - "POST /media/upload"
        - "PUT/DELETE /media/{id}"
        - "POST /media/bulk-delete"

  - name: "Taxonomies"
    description: "Custom taxonomies with terms, assignable to CPTs"
    api_prefix: "/api/v1/taxonomies"
    endpoints:
      public:
        - "GET /taxonomies"
        - "GET /taxonomies/{slug}/terms"
      admin:
        - "GET/POST /taxonomies"
        - "PUT/DELETE /taxonomies/{id}"
        - "GET/POST /taxonomies/{id}/terms"
        - "PUT/DELETE /taxonomies/{id}/terms/{termId}"

  - name: "Settings"
    description: "Key-value settings registry, encrypted sensitive values, group-based admin UI"
    api_prefix_admin: "/api/v1/admin/settings"
    endpoints:
      public:
        - "GET /settings/public"
      admin:
        - "GET /settings"
        - "GET/PUT /settings/{group}"

  - name: "Users & RBAC"
    description: "User management with roles, permissions, 2FA support"
    api_prefix_admin: "/api/v1/admin/users"
    endpoints:
      admin:
        - "GET/POST /users"
        - "GET/PUT/DELETE /users/{id}"
        - "GET /roles"

  - name: "SEO"
    description: "Per-model SEO metadata, sitemaps, IndexNow, redirects, JSON-LD structured data"
    endpoints:
      admin:
        - "GET/PUT /cpt/{type}/entries/{id}/seo"
        - "GET/PUT /pages/{id}/seo"
        - "GET /seo/indexing-logs"
        - "GET/POST /redirects"
        - "PUT/DELETE /redirects/{id}"

  - name: "Translations"
    description: "Content translations via HasTranslations trait + string translations via t() helper"
    endpoints:
      public:
        - "GET /translations/{locale}"

authentication:
  type: "Bearer token (custom ApiToken system)"
  login_endpoint: "POST /api/v1/auth/login"
  logout_endpoint: "POST /api/v1/auth/logout"
  me_endpoint: "GET /api/v1/me"
  note: "2FA supported via two_factor_code in login request"

api_base: "/api/v1"
